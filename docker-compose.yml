services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meet
      POSTGRES_PASSWORD: meet
      POSTGRES_DB: meet_transcription
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meet -d meet_transcription"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
    env_file: .env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  api:
    build:
      context: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app

volumes:
  pgdata:
