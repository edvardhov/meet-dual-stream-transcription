<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enable microphone</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 30rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #94a3b8;
      }
      .ok {
        color: #34d399;
      }
      .err {
        color: #fb7185;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1rem;
        border: 0;
        border-radius: 0.375rem;
        background: #4f46e5;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      code {
        background: #1e293b;
        padding: 0.1rem 0.3rem;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Enable microphone</h1>
      <p id="status">Requesting microphone access…</p>
      <button id="retry" hidden>Try again</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
